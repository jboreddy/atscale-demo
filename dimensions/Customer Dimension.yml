unique_name: Customer Dimension
object_type: dimension
label: Customer Dimension
type: standard

hierarchies:
  - unique_name: Customer Hierarchy
    label: Customer Hierarchy
    levels:
      - unique_name: Customer Name
        secondary_attributes:
          - unique_name: d_first_name
            label: First Name
            dataset: ds_customer
            name_column: first_name
            key_columns:
              - first_name
          - unique_name: d_last_name
            label: Last Name
            dataset: ds_customer
            name_column: last_name
            key_columns:
              - last_name
          - unique_name: d_email
            label: Email
            dataset: ds_customer
            name_column: email
            key_columns:
              - email
          - unique_name: d_phone
            label: Phone
            dataset: ds_customer
            name_column: phone
            key_columns:
              - phone

level_attributes:
  - unique_name: Customer Name
    label: Customer Name
    is_unique_key: true
    dataset: ds_customer
    name_column: full_name
    key_columns:
      - cid

relationships:
  - unique_name: Customer_Address
    from:
      hierarchy: Customer Hierarchy
      level: Customer Name
      dataset: ds_customer
      join_columns:
        - location
    to:
      dimension: Address Dimension
      level: Address
    type: embedded
